server:
  port: 8080
  servlet:
    session:
      # 会话空闲超时：30 分钟无操作即失效，需要重新登录。
      # 注意这是「空闲超时」而非「绝对超时」—— 每次 /api/** 请求都会把计时重新推后。
      timeout: 30m
      cookie:
        # 禁止 JavaScript 读取该 Cookie（document.cookie 拿不到），降低 XSS 窃取会话的风险。
        # Boot 默认即为 true，这里显式写出来是为了让安全意图可见。
        http-only: true
        # 关于 SameSite：Servlet 容器默认为 Lax，已能挡住跨站伪造的 POST 请求。
        # 开发期走 Vite 代理、生产期走 Nginx 同域，都不属于跨站，因此无需改动。
        # ⚠️ 只有将来前端真被拆到独立域名时，才需要改成 None（且必须同时启用 HTTPS）。

spring:
  application:
    name: wx-push-backend
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # ⚠️ 实测确认：本机 MySQL 经典协议端口是 3326（33060 是 X Protocol，JDBC 连不上）
    url: jdbc:mysql://localhost:3326/wx_push?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    # 密码走环境变量，不写在文件里（项目红线：密钥不进 Git）
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}

# 原生 MyBatis 配置（不用 MyBatis-Plus）
mybatis:
  # XML 映射文件位置
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.wxpush.repository.entity
  configuration:
    # 下划线列名 → 驼峰属性名
    map-underscore-to-camel-case: true

# 微信配置：三项均来自公众平台「设置与开发 → 基本配置」
# 用环境变量注入，禁止硬编码进代码或提交进 Git
wx:
  token: ${WX_TOKEN:}
  app-id: ${WX_APP_ID:}
  app-secret: ${WX_APP_SECRET:}

logging:
  level:
    root: INFO
    # 开发期开到 DEBUG 便于看消息处理链路；上线前调回 INFO
    com.wxpush: DEBUG
